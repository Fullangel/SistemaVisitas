version: '3.8'

services:
  # Servicio principal de Laravel
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: visitas-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/php/php-fpm.conf:/usr/local/etc/php-fpm.d/www.conf
    networks:
      - visitas-network
    depends_on:
      - db
      - redis
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=sistema_visitas
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis

  # Servidor web Nginx
  nginx:
    image: nginx:alpine
    container_name: visitas-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - visitas-network
    depends_on:
      - app

  # Base de datos MySQL optimizada
  db:
    image: mysql:8.0
    container_name: visitas-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sistema_visitas
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: visitas_user
      MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - visitas-network
    command: --default-authentication-plugin=mysql_native_password

  # Redis para caché y colas
  redis:
    image: redis:7-alpine
    container_name: visitas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - visitas-network

  # Laravel Horizon para gestión de colas
  horizon:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: visitas-horizon
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan horizon
    volumes:
      - ./backend:/var/www
    depends_on:
      - db
      - redis
    networks:
      - visitas-network
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=sistema_visitas
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # Frontend con Node.js
  frontend:
    image: node:18-alpine
    container_name: visitas-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - visitas-network

  # Mailhog para pruebas de correo
  mailhog:
    image: mailhog/mailhog:latest
    container_name: visitas-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - visitas-network

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  visitas-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16