<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Nacional de Visitas</title>
    <meta name="description" content="Sistema integral de gestión de visitas a nivel nacional" />
    <meta name="keywords" content="visitas, gestión, nacional, sistema" />
    <meta name="author" content="Sistema Nacional de Visitas" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sistema Nacional de Visitas" />
    <meta property="og:description" content="Sistema integral de gestión de visitas a nivel nacional" />
    <meta property="og:url" content="https://sistema-visitas-nacional.com" />
    <meta property="og:site_name" content="Sistema Nacional de Visitas" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sistema Nacional de Visitas" />
    <meta name="twitter:description" content="Sistema integral de gestión de visitas a nivel nacional" />
    
    <!-- Seguridad -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet" />
    
    <!-- Script para prevenir FOUC (Flash of Unstyled Content) -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme') || 'system';
          const getSystemTheme = () => window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          const actualTheme = theme === 'system' ? getSystemTheme() : theme;
          
          if (actualTheme === 'dark') {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.style.setProperty('color-scheme', actualTheme);
        } catch (e) {
          console.error('Error applying theme:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
