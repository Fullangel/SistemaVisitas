version: '3.8'

# Docker Compose para desarrollo con herramientas adicionales
services:
  # Servicios principales heredados de docker-compose.yml
  app:
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
    environment:
      - XDEBUG_MODE=debug,profile
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - PHP_IDE_CONFIG=serverName=visitas-docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # PhpMyAdmin para desarrollo
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: visitas_phpmyadmin_dev
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: secret
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 100M
    depends_on:
      - db
    networks:
      - visitas-network
    profiles:
      - tools

  # Redis Commander para desarrollo
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: visitas_redis_commander_dev
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
      REDIS_PASSWORD: ''
      HTTP_USER: admin
      HTTP_PASSWORD: admin
    depends_on:
      - redis
    networks:
      - visitas-network
    profiles:
      - tools

  # Mailhog para pruebas de email
  mailhog:
    image: mailhog/mailhog:latest
    container_name: visitas_mailhog_dev
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - visitas-network
    profiles:
      - tools

networks:
  visitas-network:
    driver: bridge
    name: visitas-network