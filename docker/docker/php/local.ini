; Configuración PHP optimizada para Sistema de Visitas Nacional

; Configuración de rendimiento
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 50M
post_max_size = 50M
max_file_uploads = 20

; Configuración de errores y logging
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /var/log/php_errors.log

; Configuración de sesiones para escalabilidad
session.gc_maxlifetime = 1440
session.gc_probability = 1
session.gc_divisor = 1000
session.save_handler = redis
session.save_path = "tcp://redis:6379"

; Configuración de OPcache para mejorar rendimiento
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
opcache.validate_timestamps = 1
opcache.save_comments = 1
opcache.enable_file_override = 1

; Configuración de zona horaria
date.timezone = America/Argentina/Buenos_Aires

; Configuración de Redis
redis.session.locking_enabled = 1
redis.session.lock_expire = 30
redis.session.lock_retries = -1
redis.session.lock_wait_time = 20000

; Configuración de seguridad
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1