# Configuración de Redis optimizada para Laravel

# Red
bind 0.0.0.0
port 6379
protected-mode no

# Memoria
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistencia
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes

# Rendimiento
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Logs
loglevel notice

# Seguridad
# Deshabilitar comandos peligrosos
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

# Optimización para Laravel
# Habilitar keyspace events para cache tags
notify-keyspace-events Ex