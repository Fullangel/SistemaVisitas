# Este archivo intentará configurar rate limiting en el contexto http
# pero necesita ser incluido desde nginx.conf

# Las siguientes líneas causarán error si se cargan en el contexto server
# y deberían estar en el contexto http
# limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
# limit_req_zone $binary_remote_addr zone=general:10m rate=1r/s;