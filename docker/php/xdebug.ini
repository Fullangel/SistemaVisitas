; Xdebug Configuration for Development
zend_extension=xdebug.so

; Mode
xdebug.mode=debug,profile,trace

; Client settings
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.start_with_request=yes

; Output settings
xdebug.output_dir=/var/www/html/storage/logs
xdebug.profiler_output_name=cachegrind.out.%p

; Max nesting level
xdebug.max_nesting_level=512

; Scream (disable @ operator)
xdebug.scream=0

; Show local variables
xdebug.show_local_vars=1

; Collect parameters
xdebug.collect_params=4

; Collect return values
xdebug.collect_return=1

; Collect variables
xdebug.collect_vars=1

; Trace format
xdebug.trace_format=1

; Profiler enable trigger
xdebug.profiler_enable_trigger=1

; Profiler enable trigger value
xdebug.profiler_enable_trigger_value=1