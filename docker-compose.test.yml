version: '3.8'

# Docker Compose para pruebas y CI/CD
services:
  # Backend para pruebas
  app-test:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
      target: test
    container_name: visitas_app_test
    restart: "no"
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=testing
      - DB_CONNECTION=mysql
      - DB_HOST=127.0.0.1
      - DB_PORT=3306
      - DB_DATABASE=visitantes
      - DB_USERNAME=visitante
      - DB_PASSWORD=visitante1
      - REDIS_HOST=redis-test
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - JWT_SECRET=test-secret-key
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - visitas-test-network
    command: ["php", "artisan", "test"]

  # Base de datos para pruebas
  db-test:
    image: mysql:8.0
    container_name: visitas_db_test
    restart: "no"
    environment:
      MYSQL_DATABASE: visitantes
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: visitante1
      MYSQL_USER: visitante
      SERVICE_TAGS: test
      SERVICE_NAME: mysql
    volumes:
      - db-test-data:/var/lib/mysql
    networks:
      - visitas-test-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "visitante", "-pvisitante1", "--silent"]
      timeout: 20s
      retries: 10
      interval: 10s

  # Redis para pruebas
  redis-test:
    image: redis:7-alpine
    container_name: visitas_redis_test
    restart: "no"
    volumes:
      - redis-test-data:/data
    networks:
      - visitas-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Frontend para pruebas
  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: test
    container_name: visitas_frontend_test
    restart: "no"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=test
      - VITE_API_URL=http://app-test:8080/api
    depends_on:
      - app-test
    networks:
      - visitas-test-network
    command: ["npm", "run", "test"]

  # Servidor de pruebas de carga
  k6:
    image: grafana/k6:latest
    container_name: visitas_k6
    restart: "no"
    volumes:
      - ./tests/load:/scripts
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
    depends_on:
      - app-test
      - influxdb
    networks:
      - visitas-test-network
    profiles:
      - load-test

  # InfluxDB para métricas de pruebas
  influxdb:
    image: influxdb:2.7
    container_name: visitas_influxdb
    restart: "no"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin123
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - visitas-test-network
    profiles:
      - load-test

  # Grafana para visualización
  grafana:
    image: grafana/grafana:latest
    container_name: visitas_grafana
    restart: "no"
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./tests/load/grafana:/etc/grafana/provisioning
    depends_on:
      - influxdb
    networks:
      - visitas-test-network
    profiles:
      - load-test

volumes:
  db-test-data:
  redis-test-data:
  influxdb-data:
  grafana-data:

networks:
  visitas-test-network:
    driver: bridge
    name: visitas-test-network